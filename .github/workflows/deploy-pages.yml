# Publishes the app to GitHub Pages together with the latest offline data.
# Settings → Pages → Build and deployment → Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_run:
    workflows: ['Build offroad map']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp index.html service-worker.js router.js manifest.json icon.png _site/
          cp -r vendor _site/
          if gh release download map-latest --pattern 'bulgaria*' --dir _site; then
            ls -lh _site/bulgaria*
          else
            echo "::warning::No offline data yet — run the 'Build offroad map' workflow once."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
