# Builds the offline vector map of Bulgaria (bulgaria.pmtiles) from OpenStreetMap
# and stores it as an asset of the "map-latest" release. The Pages deploy picks it up from there.
name: Build offroad map

on:
  workflow_dispatch:                 # manual: Actions → Build offroad map → Run workflow
  schedule:
    - cron: '0 2 * * 1'              # every Monday 02:00 UTC — fresh OSM data weekly
  push:
    branches: [main, master]
    paths: ['map/offroad-schema.yml']

permissions:
  contents: write                    # create/update the release asset

concurrency:
  group: build-map
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Planetiler
        run: curl -fsSL --retry 3 -o planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar

      - name: Download OSM data (Bulgaria + water polygons)
        run: |
          mkdir -p data/sources
          UA="OffRoad-Map map builder (github.com/${{ github.repository }})"
          curl -fL --retry 5 --retry-delay 20 --retry-all-errors -A "$UA" \
            -o data/sources/bulgaria.osm.pbf \
            https://download.geofabrik.de/europe/bulgaria-latest.osm.pbf
          curl -fL --retry 5 --retry-delay 20 --retry-all-errors -A "$UA" \
            -o data/sources/water-polygons.zip \
            https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
          ls -lh data/sources

      - name: Build bulgaria.pmtiles
        run: >
          java -Xmx6g -jar planetiler.jar generate-custom
          --schema=map/offroad-schema.yml
          --osm_path=data/sources/bulgaria.osm.pbf
          --water_polygons_path=data/sources/water-polygons.zip
          --output=bulgaria.pmtiles
          --force

      - name: Map size
        run: ls -lh bulgaria.pmtiles

      - name: Publish to the map-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view map-latest >/dev/null 2>&1; then
            gh release create map-latest \
              --title "Офроуд карта на България (последна)" \
              --notes "Генерира се автоматично от OpenStreetMap всеки понеделник. © OpenStreetMap contributors, ODbL." \
              --latest=false
          fi
          gh release upload map-latest bulgaria.pmtiles --clobber
